name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: major, minor or patch"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # Deny all permissions by default at workflow level

jobs:
  release:
    runs-on: ubuntu-latest
    environment: publish
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write # Required for authentication with PyPI using OIDC
      contents: write # Required to push commits and tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: 3.14
          enable-cache: false

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Run bump2version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uvx bump2version ${BUMP}

          # Get the new tag
          TAG=$(git describe --tags --exact-match)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          # Get the previous tag for this extension
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          # If there is a previous tag, get commits since that tag, otherwise get all commits
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..HEAD" || RANGE="HEAD"
          # Format commit messages as a markdown list for the release body
          git log "$RANGE" --pretty=format:"- %B" > /tmp/release_body.md

      - name: Push version bump commit and tag
        env:
          WORKFLOW_ACCESS_TOKEN: ${{ secrets.WORKFLOW_ACCESS_TOKEN }}
        run: |
          # Bypass branch protection rules by using the workflow access token
          git remote set-url origin "https://x-access-token:${WORKFLOW_ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin master --tags --atomic

      - name: Build wheel 📦
        run: uv build

      - name: Publish to PyPI 🚀
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --notes-file /tmp/release_body.md
